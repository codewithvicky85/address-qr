<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Address QR Generator</title>

  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #020617, #0f172a);
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    textarea {
      width: 90%;
      max-width: 800px;
      height: 120px;
      padding: 15px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    button {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      color: white;
    }

    #generateBtn {
      background: #2563eb;
    }

    #downloadBtn {
      background: #16a34a;
      display: none;
      margin-left: 10px;
    }

    #qrcode {
      margin-top: 30px;
      display: flex;
      justify-content: center;
    }

    footer {
      margin-top: 60px;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <h1>Address QR Generator</h1>
  <p>Enter full address below</p>

  <textarea id="address" placeholder="Enter address here..."></textarea>
  <br>

  <button id="generateBtn" onclick="generateQR()">Generate QR Code</button>
  <button id="downloadBtn" onclick="downloadQR()">Download QR (PNG)</button>

  <div id="qrcode"></div>

  <footer>
    © 2026 Address QR Generator | No data stored
  </footer>

  <script>
    function generateQR() {
      const address = document.getElementById("address").value.trim();

      if (!address) {
        alert("Please enter an address");
        return;
      }

      const qrDiv = document.getElementById("qrcode");
      qrDiv.innerHTML = "";

      new QRCode(qrDiv, {
        text: address,
        width: 250,
        height: 250
      });

      // Show download button
      document.getElementById("downloadBtn").style.display = "inline-block";
    }

    function downloadQR() {
      const img = document.querySelector("#qrcode img");
      const canvas = document.querySelector("#qrcode canvas");

      let dataUrl;
      if (img) {
        dataUrl = img.src;
      } else if (canvas) {
        dataUrl = canvas.toDataURL("image/png");
      }

      const link = document.createElement("a");
      link.href = dataUrl;
      link.download = "address-qr.png";
      link.click();
    }
  </script>

</body>
</html>
