<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Address QR Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      padding-top: 50px;
    }
    textarea {
      width: 80%;
      height: 100px;
      padding: 10px;
      font-size: 16px;
    }
    button {
      margin-top: 15px;
      padding: 12px 25px;
      font-size: 16px;
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 6px;
    }
    #qrcode {
      margin-top: 25px;
    }
  </style>
</head>
<body>

  <h1>Address QR Generator</h1>
  <p>Enter full address below</p>

  <textarea id="address" placeholder="Enter address here..."></textarea><br>
  <button onclick="generateQR()">Generate QR Code</button>

  <div id="qrcode"></div>

  <script>
    function generateQR() {
      const address = document.getElementById("address").value.trim();
      if (!address) {
        alert("Please enter an address");
        return;
      }
      document.getElementById("qrcode").innerHTML = "";
      new QRCode(document.getElementById("qrcode"), {
        text: address,
        width: 200,
        height: 200
      });
    }
  </script>

</body>
</html>
