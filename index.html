<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Address QR Generator</title>

  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      padding-top: 50px;
    }
    textarea {
      width: 80%;
      height: 100px;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
    }
    button {
      margin-top: 15px;
      padding: 12px 25px;
      font-size: 16px;
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 6px;
    }
    #qrcode {
      margin-top: 25px;
    }
    #downloadBtn {
      display: none;
      background: #16a34a;
    }
  </style>
</head>
<body>

  <h1>Address QR Generator</h1>
  <p>Enter full address below</p>

  <textarea id="address" placeholder="Enter address here..."></textarea><br>

  <button onclick="generateQR()">Generate QR Code</button>
  <br>
  <button id="downloadBtn" onclick="downloadQR()">Download QR (PNG)</button>

  <div id="qrcode"></div>

  <script>
    let qrGenerated = false;

    function generateQR() {
      const address = document.getElementById("address").value.trim();
      if (!address) {
        alert("Please enter an address");
        return;
      }

      const qrDiv = document.getElementById("qrcode");
      qrDiv.innerHTML = "";

      new QRCode(qrDiv, {
        text: address,
        width: 250,
        height: 250
      });

      qrGenerated = true;
      document.getElementById("downloadBtn").style.display = "inline-block";
    }

    function downloadQR() {
      if (!qrGenerated) return;

      const img = document.querySelector("#qrcode img");
      const canvas = document.querySelector("#qrcode canvas");

      let dataUrl;
      if (img) {
        dataUrl = img.src;
      } else if (canvas) {
        dataUrl = canvas.toDataURL("image/png");
      }

      const link = document.createElement("a");
      link.href = dataUrl;
      link.download = "address-qr.png";
      link.click();
    }
  </script>

</body>
</html>
