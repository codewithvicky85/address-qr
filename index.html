<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Address QR Generator</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    textarea {
      width: 90%;
      max-width: 800px;
      height: 120px;
      padding: 15px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
    }

    button {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      color: white;
    }

    #generateBtn { background: #2563eb; }
    #downloadBtn { background: #16a34a; display: none; margin-left: 10px; }

    #qrcode {
      margin-top: 30px;
      background: white;
      padding: 20px;      /* ✅ quiet zone */
      display: inline-block;
    }
  </style>
</head>
<body>

  <h1>Address QR Generator</h1>
  <p>Enter full address (opens in Google Maps)</p>

  <textarea id="address" placeholder="Example: DPS Kamptee Road Nagpur"></textarea>
  <br>

  <button id="generateBtn" onclick="generateQR()">Generate QR Code</button>
  <button id="downloadBtn" onclick="downloadQR()">Download QR (PNG)</button>

  <div id="qrcode"></div>

  <script>
    function generateQR() {
      const address = document.getElementById("address").value.trim();
      if (!address) {
        alert("Please enter an address");
        return;
      }

      // ✅ Convert address to Google Maps URL
      const mapUrl =
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(address);

      const qrDiv = document.getElementById("qrcode");
      qrDiv.innerHTML = "";

      new QRCode(qrDiv, {
        text: mapUrl,
        width: 300,
        height: 300,
        correctLevel: QRCode.CorrectLevel.H // ✅ high error correction
      });

      document.getElementById("downloadBtn").style.display = "inline-block";
    }

    function downloadQR() {
      const canvas = document.querySelector("#qrcode canvas");
      const link = document.createElement("a");
      link.href = canvas.toDataURL("image/png");
      link.download = "address-qr.png";
      link.click();
    }
  </script>

</body>
</html>
